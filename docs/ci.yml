name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ffmpeg cmake

      - name: Generate test fixtures
        run: ./scripts/make-fixtures.sh

      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release .

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Run headless tests
        run: |
          mkdir -p build/reports
          ./build/SnakePuppyTests_artefacts/Release/SnakePuppyTests \
            --junit build/reports/tests.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests.xml
